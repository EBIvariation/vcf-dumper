spring.jmx.enabled = false

#spring.profiles.active=oauth2-security
#security.oauth2.resource.user-info-uri = ...

# The MongoDB connection details and the collection names are NOT provided in this file. They are supplied at runtime by
# an external application.properties (in Kubernetes: a Secret mounted at /app/config/application.properties, which Spring
# Boot picks up from ./config/ when running from /app). For a local IDE run, use a git-ignored ./config/application.properties.
# Properties expected from the external file:
#spring.data.mongodb.host=<host:port[,host:port...]>
#spring.data.mongodb.authentication-database=<auth db, empty for no authentication>
#spring.data.mongodb.username=<user>
#spring.data.mongodb.password=<password>
#db.collection-names.files=<collection>
#db.collection-names.variants=<collection>
#db.collection-names.annotation-metadata=<collection>
#db.collection-names.features=<collection>
#db.collection-names.annotations=<collection>
spring.data.mongodb.read-preference=secondaryPreferred
spring.data.mongodb.authentication-mechanism=SCRAM-SHA-1

# See https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-2.1-Release-Notes#bean-overriding
spring.main.allow-bean-definition-overriding=true

# The service is exposed behind the EVA ingress, which does not rewrite paths
server.servlet.context-path=/eva/webservices/vcf-dumper

# Behind the ingress, take the scheme, host, port and prefix of the public URL from the X-Forwarded-* headers
server.forward-headers-strategy=framework

# Exports are streamed and can last up to the async request timeout (5 minutes): let in-flight requests finish on shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5m

# Health and liveness/readiness probes, served at <context-path>/actuator/health[/liveness|/readiness]
management.endpoints.web.exposure.include=info,health
management.endpoint.health.probes.enabled=true
management.info.git.mode=simple

# The root log level is set to error in logback.xml (vcf-dumper-lib): keep MongoDB connection problems visible
logging.level.org.mongodb.driver=WARN
