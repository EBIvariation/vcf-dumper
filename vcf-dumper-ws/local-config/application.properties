# Configuration for running vcf-dumper-ws locally with docker compose (see ../docker-compose.yaml).
# The file is mounted at /app/config/application.properties, like the Secret is in Kubernetes.
# The credentials below are for the throw-away local MongoDB only.
spring.data.mongodb.host=mongodb:27017
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.username=mongo_user
spring.data.mongodb.password=mongo_pass

db.collection-names.files=files
db.collection-names.variants=variants
db.collection-names.annotation-metadata=annotationsMetadata
db.collection-names.features=features
db.collection-names.annotations=annotations
