stages:
  - build
  - deploy

# Shared .build_docker / .update_and_deploy templates live in eva-k8s
# See https://github.com/EBIvariation/eva-k8s/blob/main/gitlab-ci/webservice.yml.
include:
  - remote: 'https://raw.githubusercontent.com/EBIvariation/eva-k8s/refs/tags/v1.2/gitlab-ci/webservice.yml'

# REQUIRED GitLab CI/CD Variables (Global):
# DOCKER_AUTH_CONFIG: Contains username and password for the docker registry below
# GITHUB_USER: GitHub username for accessing private maven settings repository
# GITHUB_TOKEN: GitHub personal access token for accessing private maven settings repository

# The manifests are in eva-k8s/k8s-manifests/vcf-dumper-ws. SERVICE_NAME is also the name of the deployment and of the
# namespace, and the name of the property set in eva-k8s/scripts/maven-settings-to-properties.py.
variables:
  IMAGE_REPOSITORY: dockerhub.ebi.ac.uk/ebivariation/vcf-dumper

# ============================================================================
# PRODUCTION: Deploy on git tags
# ============================================================================

build:docker:prod:
  extends: .build_docker
  variables:
    SERVICE_NAME: vcf-dumper-ws
    DOCKERFILE_PATH: vcf-dumper-ws/Dockerfile
    IMAGE_TAG: vcf-dumper-ws-$CI_COMMIT_TAG
  only:
    - tags

deploy-to-cluster:prod:
  extends: .update_and_deploy
  needs:
    - build:docker:prod
  variables:
    SERVICE_NAME: vcf-dumper-ws
    IMAGE_TAG: vcf-dumper-ws-$CI_COMMIT_TAG
    MAVEN_PROFILE: production
    K8S_MANIFEST_PATH: k8s-manifests/vcf-dumper-ws/overlays/prod
    KUBECONFIG_FILE: $KUBECONFIG_FILE_PROD
  environment:
    name: prod
  only:
    - tags

deploy-to-cluster:prod-fallback:
  extends: .update_and_deploy
  needs:
    - build:docker:prod
  variables:
    SERVICE_NAME: vcf-dumper-ws
    IMAGE_TAG: vcf-dumper-ws-$CI_COMMIT_TAG
    MAVEN_PROFILE: production,production-fallback
    K8S_MANIFEST_PATH: k8s-manifests/vcf-dumper-ws/overlays/prod
    KUBECONFIG_FILE: $KUBECONFIG_FILE_PROD_FALLBACK
  environment:
    name: prod-fallback
  only:
    - tags

# ============================================================================
# DEVELOPMENT: Deploy on main branch
# ============================================================================

build:docker:dev:
  extends: .build_docker
  variables:
    SERVICE_NAME: vcf-dumper-ws
    DOCKERFILE_PATH: vcf-dumper-ws/Dockerfile
    IMAGE_TAG: vcf-dumper-ws-dev-$CI_COMMIT_SHORT_SHA
  only:
    - main

deploy-to-cluster:dev:
  extends: .update_and_deploy
  needs:
    - build:docker:dev
  variables:
    SERVICE_NAME: vcf-dumper-ws
    IMAGE_TAG: vcf-dumper-ws-dev-$CI_COMMIT_SHORT_SHA
    MAVEN_PROFILE: development
    K8S_MANIFEST_PATH: k8s-manifests/vcf-dumper-ws/overlays/dev
    KUBECONFIG_FILE: $KUBECONFIG_FILE_DEV
  environment:
    name: development
  only:
    - main

# ============================================================================
# STAGING: Deploy on main branch (reuses the image built for development)
# ============================================================================

deploy-to-cluster:staging:
  extends: .update_and_deploy
  needs:
    - build:docker:dev
  variables:
    SERVICE_NAME: vcf-dumper-ws
    IMAGE_TAG: vcf-dumper-ws-dev-$CI_COMMIT_SHORT_SHA
    MAVEN_PROFILE: production_processing
    K8S_MANIFEST_PATH: k8s-manifests/vcf-dumper-ws/overlays/staging
    KUBECONFIG_FILE: $KUBECONFIG_FILE_STAGING
  environment:
    name: staging
  only:
    - main
